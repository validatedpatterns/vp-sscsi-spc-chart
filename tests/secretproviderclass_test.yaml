suite: SecretProviderClass hub/spoke/external behavior
templates:
  - templates/spc-library.tpl
  - templates/install-default-manifests.yaml
release:
  name: release-test
tests:
  - it: renders nothing when installDefaultManifests is false
    template: templates/install-default-manifests.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders SPC when installDefaultManifests and enabled are true
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: SecretProviderClass
          apiVersion: secrets-store.csi.x-k8s.io/v1
          any: true

  - it: uses hub defaults on a hub cluster
    template: templates/install-default-manifests.yaml
    set:
      clusterGroup:
        isHubCluster: true
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
          namespace: app-ns
          name: app-secrets
        auth:
          roleName: hub-role
        vault:
          hubMountPath: hub
      global:
        hubClusterDomain: apps.hub.example.org
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: metadata.namespace
          value: app-ns
      - equal:
          path: metadata.name
          value: app-secrets
      - equal:
          path: spec.parameters.vaultAddress
          value: https://vault-vault.apps.hub.example.org
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: hub
      - equal:
          path: spec.parameters.roleName
          value: hub-role

  - it: uses spoke mount and role on spoke cluster with centralized Vault
    template: templates/install-default-manifests.yaml
    set:
      clusterGroup:
        isHubCluster: false
      global:
        clusterDomain: spoke.example.com
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: spoke.example.com
      - equal:
          path: spec.parameters.roleName
          value: spoke.example.com-role

  - it: uses external Vault address when configured
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        vault:
          externalAddress: https://vault.external.example:8200
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultAddress
          value: https://vault.external.example:8200

  - it: omits vaultCACertPath when not provided
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: ""
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - notExists:
          path: spec.parameters.vaultCACertPath

  - it: honors explicit vaultCACertPath
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: /etc/custom/ca.pem
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultCACertPath
          value: /etc/custom/ca.pem
