# Hub vs spoke is inferred from global.localClusterDomain and global.hubClusterDomain
# (see vp_sscsi_spc.ishubcluster), not clusterGroup.isHubCluster.
suite: SecretProviderClass hub/spoke/external behavior
templates:
  - templates/spc-library.tpl
  - templates/install-default-manifests.yaml
release:
  name: release-test
tests:
  - it: renders nothing when installDefaultManifests is false
    template: templates/install-default-manifests.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders SPC when installDefaultManifests and enabled are true
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: SecretProviderClass
          apiVersion: secrets-store.csi.x-k8s.io/v1
          any: true

  - it: Inferred hub - vaultKubernetesMountPath is hub when localClusterDomain equals hubClusterDomain
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
          namespace: app-ns
          name: app-secrets
        auth:
          roleName: hub-role
      global:
        clusterDomain: group-one
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.hub.example.org
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: metadata.namespace
          value: app-ns
      - equal:
          path: metadata.name
          value: app-secrets
      - equal:
          path: spec.parameters.vaultAddress
          value: https://vault-vault.apps.hub.example.org
      - equal:
          path: spec.parameters.authType
          value: kubernetes
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: hub
      - equal:
          path: spec.parameters.roleName
          value: hub-role

  - it: Inferred spoke - vaultKubernetesMountPath is localClusterDomain when it differs from hubClusterDomain
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
      global:
        clusterDomain: group-one
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: spoke.apps.example.org
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: spoke.apps.example.org
      - equal:
          path: spec.parameters.roleName
          value: spoke.apps.example.org-role

  - it: Inferred hub - ocpSecretsStoreCsiVault.vault.hubMountPath overrides computed mount path
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        vault:
          hubMountPath: hub
      global:
        clusterDomain: group-one
        hubClusterDomain: apps.hub.example.org
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: hub

  - it: Inferred hub - roleSlug yields hub-sscsi-* using hub-style mount path prefix
    template: templates/install-default-manifests.yaml
    set:
      clusterGroup:
        applications:
          openshift-sscsi-vault:
            namespace: config-demo
            ssCsiWorkloadAuth:
              - serviceAccount: config-demo-sa
                cluster: hub
                roleSlug: config-demo-config-demo-sa-config-demo
      global:
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.hub.example.org
        clusterDomain: group-one
      ocpSecretsStoreCsiVault:
        applicationKey: openshift-sscsi-vault
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
        auth:
          roleName: hub-role
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: metadata.namespace
          value: config-demo
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: hub
      - equal:
          path: spec.parameters.roleName
          value: hub-sscsi-config-demo-config-demo-sa-config-demo

  - it: Inferred hub - ssCsiWorkloadAuth entry namespace wins over application namespace
    template: templates/install-default-manifests.yaml
    set:
      clusterGroup:
        applications:
          openshift-sscsi-vault:
            namespace: vault
            ssCsiWorkloadAuth:
              - serviceAccount: config-demo-sa
                namespace: config-demo
                cluster: hub
                roleSlug: config-demo-config-demo-sa-config-demo
      global:
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.hub.example.org
        clusterDomain: group-one
      ocpSecretsStoreCsiVault:
        applicationKey: openshift-sscsi-vault
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: metadata.namespace
          value: config-demo

  - it: Inferred spoke - vaultKubernetesMountPath and default role use global.localClusterDomain
    template: templates/install-default-manifests.yaml
    set:
      global:
        clusterDomain: spoke.example.com
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.spoke.example.org
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.authType
          value: kubernetes
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: apps.spoke.example.org
      - equal:
          path: spec.parameters.roleName
          value: apps.spoke.example.org-role

  - it: Inferred spoke - roleSlug prefix uses localClusterDomain (not ssCsiWorkloadAuth.cluster short name); fleet hashicorp-vault app does not force hub mode
    template: templates/install-default-manifests.yaml
    set:
      clusterGroup:
        applications:
          openshift-sscsi-vault:
            namespace: config-demo
            ssCsiWorkloadAuth:
              - serviceAccount: config-demo-sa
                cluster: group-one
                roleSlug: config-demo-config-demo-sa-config-demo
          hashicorp-vault:
            chart: hashicorp-vault
      global:
        clusterDomain: spoke.example.com
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.spoke.example.org
      ocpSecretsStoreCsiVault:
        applicationKey: openshift-sscsi-vault
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultKubernetesMountPath
          value: apps.spoke.example.org
      - equal:
          path: spec.parameters.roleName
          value: apps.spoke.example.org-sscsi-config-demo-config-demo-sa-config-demo

  - it: Inferred spoke - defaults metadata.namespace to release namespace when app and workload auth omit namespace
    template: templates/install-default-manifests.yaml
    release:
      name: release-test
      namespace: app-release-ns
    set:
      clusterGroup:
        applications:
          openshift-sscsi-vault:
            ssCsiWorkloadAuth:
              - serviceAccount: config-demo-sa
      global:
        clusterDomain: spoke.example.com
        hubClusterDomain: apps.hub.example.org
        localClusterDomain: apps.spoke.example.org
      ocpSecretsStoreCsiVault:
        applicationKey: openshift-sscsi-vault
        secretProviderClass:
          installDefaultManifests: true
          enabled: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: metadata.namespace
          value: app-release-ns

  - it: uses external Vault address when configured
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        vault:
          externalAddress: https://vault.external.example:8200
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultAddress
          value: https://vault.external.example:8200

  - it: supports arbitrary auth method and custom auth parameters from values
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        auth:
          method: jwt
          extraParameters:
            vaultAuthMountPath: auth/jwt
            roleName: app-jwt-role
            vaultTokenAudience: vault
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.authType
          value: jwt
      - notExists:
          path: spec.parameters.vaultKubernetesMountPath
      - equal:
          path: spec.parameters.vaultAuthMountPath
          value: auth/jwt
      - equal:
          path: spec.parameters.roleName
          value: app-jwt-role

  - it: supports approle auth with pass-through parameters
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        auth:
          method: approle
          extraParameters:
            vaultAuthMountPath: auth/approle
            roleId: 11111111-2222-3333-4444-555555555555
            secretRef: app-approle-secret
            secretKey: secretId
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.authType
          value: approle
      - notExists:
          path: spec.parameters.vaultKubernetesMountPath
      - notExists:
          path: spec.parameters.roleName
      - equal:
          path: spec.parameters.vaultAuthMountPath
          value: auth/approle
      - equal:
          path: spec.parameters.roleId
          value: 11111111-2222-3333-4444-555555555555
      - equal:
          path: spec.parameters.secretRef
          value: app-approle-secret
      - equal:
          path: spec.parameters.secretKey
          value: secretId

  - it: omits vaultCACertPath when not provided
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: ""
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - notExists:
          path: spec.parameters.vaultCACertPath

  - it: honors explicit vaultCACertPath
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: /etc/custom/ca.pem
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultCACertPath
          value: /etc/custom/ca.pem

  - it: sets vaultCACertPath from projectedClusterCa when enabled (CNO proxy bundle)
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: ""
          projectedClusterCa:
            enabled: true
            injectTrustedCabundle: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultCACertPath
          value: /etc/pki/vault-ca/ca-bundle.crt

  - it: uses PEM key path when projectedClusterCa injectTrustedCabundle is false
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: ""
          projectedClusterCa:
            enabled: true
            injectTrustedCabundle: false
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultCACertPath
          value: /etc/pki/vault-ca/vault-tls-ca.pem

  - it: prefers explicit vaultCACertPath over projectedClusterCa
    template: templates/install-default-manifests.yaml
    set:
      ocpSecretsStoreCsiVault:
        secretProviderClass:
          installDefaultManifests: true
        tls:
          vaultCACertPath: /etc/manual/ca.pem
          projectedClusterCa:
            enabled: true
    documentSelector:
      path: kind
      value: SecretProviderClass
    asserts:
      - equal:
          path: spec.parameters.vaultCACertPath
          value: /etc/manual/ca.pem
